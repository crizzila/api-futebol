<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campeonato de Futebol - Times</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <div class="marca">
            <span class="bola" aria-hidden="true">⚽</span>
            <div>
                <h1>Campeonato de Futebol</h1>
                <p>Cliente web da API &middot; times com HATEOAS</p>
            </div>
        </div>

        <div class="controles">
            <div class="controle">
                <label for="versao">Versão da API</label>
                <select id="versao">
                    <option value="2" selected>V2 &ndash; protegida</option>
                    <option value="1">V1 &ndash; original</option>
                </select>
                <small id="versao-dica"></small>
            </div>

            <div class="controle">
                <label for="chave">Chave de API</label>
                <div class="linha">
                    <input id="chave" type="password" autocomplete="off" spellcheck="false"
                           placeholder="cole sua chave aqui">
                    <button type="button" id="limpar-chave" class="secundario">Limpar</button>
                </div>
                <small id="chave-dica">Fica só nesta aba (sessionStorage). Nunca vai para o código.</small>
            </div>
        </div>
    </header>

    <main>
        <div id="aviso" class="aviso oculto" role="status" aria-live="polite"></div>

        <section class="cartao">
            <div class="cartao-topo">
                <h2>Times</h2>
                <button type="button" id="recarregar" class="secundario">Recarregar</button>
            </div>
            <p id="resumo" class="resumo">Carregando...</p>

            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Sigla</th>
                            <th>Fundação</th>
                            <th>Estádio</th>
                            <th>Capacidade</th>
                        </tr>
                    </thead>
                    <tbody id="tabela"></tbody>
                </table>
            </div>

            <nav class="paginacao" aria-label="Paginação">
                <button type="button" id="anterior" disabled>&lsaquo; Anterior</button>
                <span id="pagina">&nbsp;</span>
                <button type="button" id="proxima" disabled>Próxima &rsaquo;</button>
            </nav>
        </section>

        <section class="cartao">
            <h2>Cadastrar time</h2>
            <form id="form-time" novalidate>
                <div class="grade">
                    <div class="campo">
                        <label for="nome">Nome do time</label>
                        <input id="nome" required minlength="3" maxlength="50" placeholder="Palmeiras">
                    </div>
                    <div class="campo">
                        <label for="sigla">Sigla (3 letras)</label>
                        <input id="sigla" required maxlength="3" pattern="[A-Za-z]{3}" placeholder="PAL">
                    </div>
                    <div class="campo">
                        <label for="fundacao">Data de fundação</label>
                        <input id="fundacao" type="date" required>
                    </div>
                    <div class="campo">
                        <label for="estadio">Estádio</label>
                        <input id="estadio" required minlength="3" maxlength="100" placeholder="Allianz Parque">
                    </div>
                    <div class="campo">
                        <label for="capacidade">Capacidade (mín. 1000)</label>
                        <input id="capacidade" type="number" required min="1000" step="1" placeholder="43713">
                    </div>
                </div>

                <div class="acoes">
                    <button type="submit" id="cadastrar">Cadastrar</button>
                    <button type="button" id="reenviar" class="secundario" disabled>
                        Reenviar o último (mesma chave de idempotência)
                    </button>
                </div>
                <p id="info-idempotencia" class="resumo"></p>
            </form>
        </section>

        <p id="limite" class="rodape"></p>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
