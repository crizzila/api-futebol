spring.application.name=api-futebol

# Banco H2 em memoria (os dados somem quando a aplicacao para)
spring.datasource.url=jdbc:h2:mem:futebol;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Swagger / OpenAPI
springdoc.enable-hateoas=false
springdoc.swagger-ui.path=/swagger-ui.html

# Publicacao (Render)
# O Render define PORT; localmente usa 8080
server.port=${PORT:8080}
# Atras do proxy do Render, usa X-Forwarded-* para gerar links https corretos
server.forward-headers-strategy=framework
# Console H2 configuravel por variavel de ambiente (SPRING_H2_CONSOLE_ENABLED)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}

# Etapa 1 - API Key
# Chave inicial (so para dev; em producao defina INITIAL_API_KEY no Render)
app.initial-api-key=${INITIAL_API_KEY:fut_chave_inicial_dev_local}
